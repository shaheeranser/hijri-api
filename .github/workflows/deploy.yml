name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish the data directory as the site root, so endpoints are served at
      # /hijri/overrides.json, /hijri/calendar/<year>.json and
      # /prayer/<city>/<profile>/<year>.json.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data
      - id: deployment
        uses: actions/deploy-pages@v4
